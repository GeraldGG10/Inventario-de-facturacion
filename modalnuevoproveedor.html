<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nuevo Proveedor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#eff1f3",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "error-container": "#ffdad6",
                        "primary-container": "#2563eb",
                        "surface-container-low": "#f2f4f6",
                        "inverse-primary": "#b4c5ff",
                        "primary": "#004ac6",
                        "surface-container-high": "#e6e8ea",
                        "on-surface-variant": "#434655",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-container": "#54647a",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed-dim": "#ffb596",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "tertiary": "#943700",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#eeefff",
                        "tertiary-container": "#bc4800",
                        "outline": "#737686",
                        "secondary-fixed": "#d3e4fe",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface": "#f7f9fb",
                        "surface-tint": "#0053db",
                        "surface-container": "#eceef0",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#505f76",
                        "on-tertiary-fixed": "#360f00",
                        "on-background": "#191c1e",
                        "secondary-container": "#d0e1fb",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#ffede6",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ba1a1a",
                        "background": "#f7f9fb",
                        "on-primary-fixed": "#00174b",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "header-height": "64px",
                        "sidebar-width": "260px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "data-mono": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #c3c6d7;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased text-on-surface">
    <!-- Modal Backdrop / Focus Overlay -->
    <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-[2px] z-40 transition-opacity duration-300"></div>
    <!-- Modal Container -->
    <div
        class="relative bg-surface-container-lowest w-full max-w-3xl rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1),_0_0_0_1px_rgba(0,0,0,0.05)] z-50 flex flex-col max-h-[90vh] overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-start justify-between px-6 py-5 border-b border-outline-variant/30">
            <div>
                <h2 class="font-headline-md text-headline-md text-on-surface">Nuevo proveedor</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Registra un nuevo proveedor para
                    gestionar tus compras e inventario</p>
            </div>
            <button
                class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high p-2 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <!-- Modal Body (Scrollable) -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-6 py-6 bg-surface">
            <form class="space-y-8">
                <!-- Section: Información del proveedor -->
                <section>
                    <h3 class="font-label-caps text-label-caps uppercase text-secondary mb-4 tracking-wider">Información
                        del proveedor</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="nombre_proveedor">Nombre/Razón social <span class="text-error">*</span></label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="nombre_proveedor" name="nombre_proveedor"
                                placeholder="Ej. Proveedora Industrial S.A." type="text" />
                        </div>
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5" for="rnc">RNC <span
                                    class="text-error">*</span></label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="rnc" name="rnc" placeholder="000000000" type="text" />
                        </div>
                        <div class="col-span-1 md:col-span-2">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-2">Tipo</label>
                            <div class="flex items-center gap-6">
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input checked=""
                                        class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary"
                                        name="tipo_proveedor" type="radio" value="empresa" />
                                    <span
                                        class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Empresa</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input
                                        class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary"
                                        name="tipo_proveedor" type="radio" value="persona" />
                                    <span
                                        class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Persona</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </section>
                <hr class="border-outline-variant/30" />
                <!-- Section: Información de contacto -->
                <section>
                    <h3 class="font-label-caps text-label-caps uppercase text-secondary mb-4 tracking-wider">Información
                        de contacto</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-1 md:col-span-2">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="contacto_nombre">Nombre del contacto <span class="text-error">*</span></label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="contacto_nombre" name="contacto_nombre"
                                placeholder="Nombre de la persona a contactar" type="text" />
                        </div>
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="telefono">Teléfono <span class="text-error">*</span></label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="telefono" name="telefono" placeholder="(000) 000-0000" type="tel" />
                        </div>
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5" for="email">Correo
                                electrónico</label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="email" name="email" placeholder="correo@empresa.com" type="email" />
                        </div>
                    </div>
                </section>
                <hr class="border-outline-variant/30" />
                <!-- Section: Ubicación -->
                <section>
                    <h3 class="font-label-caps text-label-caps uppercase text-secondary mb-4 tracking-wider">Ubicación
                    </h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="direccion">Dirección</label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="direccion" name="direccion" placeholder="Calle, número, sector" type="text" />
                        </div>
                        <div class="col-span-1 md:w-1/2">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5" for="ciudad">Ciudad /
                                Municipio</label>
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow"
                                id="ciudad" name="ciudad" placeholder="Ciudad" type="text" />
                        </div>
                    </div>
                </section>
                <hr class="border-outline-variant/30" />
                <!-- Section: Información comercial -->
                <section>
                    <h3 class="font-label-caps text-label-caps uppercase text-secondary mb-4 tracking-wider">Información
                        comercial</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="categoria">Categoría</label>
                            <div class="relative">
                                <select
                                    class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 appearance-none transition-shadow"
                                    id="categoria" name="categoria">
                                    <option disabled="" selected="" value="">Seleccione una categoría</option>
                                    <option value="electronica">Electrónica</option>
                                    <option value="computacion">Computación</option>
                                    <option value="mobiliario">Mobiliario</option>
                                    <option value="oficina">Oficina</option>
                                    <option value="accesorios">Accesorios</option>
                                    <option value="otros">Otros</option>
                                </select>
                                <div
                                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
                                    <span class="material-symbols-outlined text-[20px]">expand_more</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-span-1">
                            <label class="block font-body-sm text-body-sm text-on-surface mb-1.5"
                                for="condiciones_pago">Condiciones de pago</label>
                            <div class="relative">
                                <select
                                    class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 appearance-none transition-shadow"
                                    id="condiciones_pago" name="condiciones_pago">
                                    <option value="contado">Contado</option>
                                    <option value="credito">Crédito</option>
                                    <option value="15_dias">15 días</option>
                                    <option value="30_dias">30 días</option>
                                    <option value="60_dias">60 días</option>
                                </select>
                                <div
                                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
                                    <span class="material-symbols-outlined text-[20px]">expand_more</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <hr class="border-outline-variant/30" />
                <!-- Section: Estado & Observaciones -->
                <section>
                    <div class="grid grid-cols-1 gap-6">
                        <div>
                            <h3 class="font-label-caps text-label-caps uppercase text-secondary mb-3 tracking-wider">
                                Estado</h3>
                            <div class="flex items-center gap-6">
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input checked=""
                                        class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary"
                                        name="estado" type="radio" value="activo" />
                                    <span
                                        class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Activo</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input
                                        class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary"
                                        name="estado" type="radio" value="inactivo" />
                                    <span
                                        class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Inactivo</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label
                                class="block font-label-caps text-label-caps uppercase text-secondary mb-2 tracking-wider"
                                for="observaciones">Observaciones (Opcional)</label>
                            <textarea
                                class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-body-md text-body-md px-3 py-2 transition-shadow resize-none"
                                id="observaciones" name="observaciones"
                                placeholder="Notas adicionales sobre este proveedor..." rows="3"></textarea>
                        </div>
                    </div>
                </section>
            </form>
        </div>
        <!-- Modal Footer / Actions -->
        <div
            class="flex items-center justify-end gap-3 px-6 py-4 bg-surface-container-lowest border-t border-outline-variant/30">
            <button
                class="px-4 py-2 bg-surface-container-lowest border border-outline-variant/60 text-on-surface font-body-md text-body-md font-medium rounded hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20"
                type="button">
                Cancelar
            </button>
            <button
                class="px-4 py-2 bg-primary/50 text-on-primary font-body-md text-body-md font-medium rounded cursor-not-allowed opacity-70 transition-opacity"
                disabled="" type="button">
                Guardar proveedor
            </button>
        </div>
    </div>
</body>

</html>
