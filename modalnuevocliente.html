<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nuevo cliente - StockPro Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#eff1f3",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "error-container": "#ffdad6",
                        "primary-container": "#2563eb",
                        "surface-container-low": "#f2f4f6",
                        "inverse-primary": "#b4c5ff",
                        "primary": "#004ac6",
                        "surface-container-high": "#e6e8ea",
                        "on-surface-variant": "#434655",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-container": "#54647a",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed-dim": "#ffb596",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "tertiary": "#943700",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#eeefff",
                        "tertiary-container": "#bc4800",
                        "outline": "#737686",
                        "secondary-fixed": "#d3e4fe",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface": "#f7f9fb",
                        "surface-tint": "#0053db",
                        "surface-container": "#eceef0",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#505f76",
                        "on-tertiary-fixed": "#360f00",
                        "on-background": "#191c1e",
                        "secondary-container": "#d0e1fb",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#ffede6",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ba1a1a",
                        "background": "#f7f9fb",
                        "on-primary-fixed": "#00174b",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "header-height": "64px",
                        "sidebar-width": "260px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "data-mono": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Ambient Shadow Overlay for Modal Background -->
    <div class="fixed inset-0 bg-[#0f172a] bg-opacity-40 backdrop-blur-[2px] z-40 transition-opacity"></div>
    <!-- Modal Container -->
    <main
        class="relative z-50 w-full max-w-2xl mx-4 bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)] border border-outline-variant/30 flex flex-col max-h-[90vh]">
        <!-- Modal Header -->
        <header class="flex items-start justify-between px-6 py-5 border-b border-outline-variant/30 shrink-0">
            <div>
                <h2 class="font-headline-md text-headline-md text-on-surface">Nuevo cliente</h2>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Registra un nuevo cliente en el
                    sistema</p>
            </div>
            <button
                class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-full p-2 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
            </button>
        </header>
        <!-- Modal Body (Scrollable) -->
        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-8">
            <!-- Información personal -->
            <section class="space-y-4">
                <h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Información personal
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="fullName">
                            Nombre completo <span class="text-error">*</span>
                        </label>
                        <input
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                            id="fullName" placeholder="Ej. Juan Pérez" type="text" />
                    </div>
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="docId">
                            Documento de identidad <span class="text-error">*</span>
                        </label>
                        <input
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                            id="docId" placeholder="Ej. 001-0000000-1" type="text" />
                    </div>
                </div>
            </section>
            <!-- Información de contacto -->
            <section class="space-y-4">
                <h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Información de
                    contacto</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="phone">
                            Teléfono <span class="text-error">*</span>
                        </label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
                                <span class="material-symbols-outlined text-[18px]">call</span>
                            </span>
                            <input
                                class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                                id="phone" placeholder="(809) 000-0000" type="tel" />
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="email">
                            Correo electrónico
                        </label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
                                <span class="material-symbols-outlined text-[18px]">mail</span>
                            </span>
                            <input
                                class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                                id="email" placeholder="ejemplo@correo.com" type="email" />
                        </div>
                    </div>
                </div>
            </section>
            <!-- Dirección -->
            <section class="space-y-4">
                <h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Dirección</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1 md:col-span-2">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="address">
                            Dirección
                        </label>
                        <input
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                            id="address" placeholder="Calle, número, sector" type="text" />
                    </div>
                    <div class="space-y-1 md:col-span-2">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="city">
                            Ciudad / Municipio
                        </label>
                        <select
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm appearance-none"
                            id="city">
                            <option disabled="" selected="" value="">Selecciona una ciudad</option>
                            <option value="santo_domingo">Santo Domingo</option>
                            <option value="santiago">Santiago</option>
                            <option value="la_vega">La Vega</option>
                        </select>
                    </div>
                </div>
            </section>
            <!-- Información adicional -->
            <section class="space-y-4">
                <h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Información
                    adicional</h3>
                <div class="space-y-3">
                    <label class="block font-body-sm text-body-sm text-on-surface font-medium mb-2">Tipo de
                        cliente</label>
                    <div class="flex items-center gap-6">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input checked=""
                                class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary focus:ring-2 focus:ring-offset-2"
                                name="clientType" type="radio" value="persona" />
                            <span class="font-body-sm text-body-sm text-on-surface">Persona</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary focus:ring-2 focus:ring-offset-2"
                                name="clientType" type="radio" value="empresa" />
                            <span class="font-body-sm text-body-sm text-on-surface">Empresa</span>
                        </label>
                    </div>
                </div>
                <!-- Campos de Empresa (Initially Hidden, typically controlled via JS, shown here as example of structure) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 hidden" id="companyFields">
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="companyName">
                            Nombre de la empresa
                        </label>
                        <input
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                            id="companyName" placeholder="Razón social" type="text" />
                    </div>
                    <div class="space-y-1">
                        <label class="block font-body-sm text-body-sm text-on-surface font-medium" for="rnc">
                            RNC
                        </label>
                        <input
                            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm"
                            id="rnc" placeholder="000000000" type="text" />
                    </div>
                </div>
            </section>
            <!-- Estado -->
            <section class="space-y-4">
                <h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Estado</h3>
                <div class="flex items-center gap-3 bg-surface-container-low p-1 rounded-lg w-fit">
                    <button
                        class="px-4 py-1.5 rounded-md font-body-sm text-body-sm font-medium bg-surface-container-lowest shadow-sm text-on-surface transition-all">Activo</button>
                    <button
                        class="px-4 py-1.5 rounded-md font-body-sm text-body-sm font-medium text-on-surface-variant hover:text-on-surface transition-all">Inactivo</button>
                </div>
            </section>
        </div>
        <!-- Modal Footer -->
        <footer
            class="flex items-center justify-end gap-3 px-6 py-4 border-t border-outline-variant/30 bg-surface-container-low/50 shrink-0 rounded-b-xl">
            <button
                class="px-4 py-2 rounded-lg font-body-md text-body-md font-medium text-on-surface-variant hover:bg-surface-container-highest transition-colors border border-transparent">
                Cancelar
            </button>
            <button
                class="px-4 py-2 rounded-lg font-body-md text-body-md font-medium text-on-primary bg-primary/50 cursor-not-allowed transition-colors shadow-sm"
                disabled="">
                Guardar cliente
            </button>
        </footer>
    </main>
    <script>
        // Simple script to toggle company fields for demonstration
        const radioPersona = document.querySelector('input[value="persona"]');
        const radioEmpresa = document.querySelector('input[value="empresa"]');
        const companyFields = document.getElementById('companyFields');

        radioPersona.addEventListener('change', () => {
            if (radioPersona.checked) {
                companyFields.classList.add('hidden');
            }
        });

        radioEmpresa.addEventListener('change', () => {
            if (radioEmpresa.checked) {
                companyFields.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
